serif" font-size="11.5" font-weight="400" fill="#a0a0b8" text-anchor="start" >token cut per agent run</text><rect x="654" y="152" width="170" height="98" rx="12" fill="#0f0f1a" stroke="#2a2a40"/><text x="670" y="198" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="url(#g)" text-anchor="start" >90%+</text><text x="670" y="222" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a0a0b8" text-anchor="start" >API latency reduction</text>
